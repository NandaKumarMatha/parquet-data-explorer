name: parquet-explorer
title: Parquet Explorer
base: core24
version: '0.2.52'
summary: A simple Parquet file viewer
description: |
  A PyQt6 based application to view and explore Parquet files.
  Features include opening parquet files and viewing them in a table.

grade: stable
confinement: strict
license: MIT
website: 
  - https://nandakumarmatha.github.io/
source-code: 
  - https://github.com/NandaKumarMatha/parquet-data-explorer
issues: 
  - https://github.com/NandaKumarMatha/parquet-data-explorer/issues
icon: snap/gui/icon.png
contact: 
  - nandakumarmatha98@gmail.com

plugs:
  shared-memory:
    interface: shared-memory
    private: true

# Mesa/Chromium probe hardcoded host paths; bind snap's drivers there.
layout:
  /usr/lib/x86_64-linux-gnu/gbm:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/gbm
  /usr/lib/x86_64-linux-gnu/dri:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/dri
  /usr/lib/aarch64-linux-gnu/gbm:
    bind: $SNAP/usr/lib/aarch64-linux-gnu/gbm
  /usr/lib/aarch64-linux-gnu/dri:
    bind: $SNAP/usr/lib/aarch64-linux-gnu/dri

apps:
  parquet-explorer:
    command: bin/parquet-explorer-launch
    common-id: parquet-explorer
    plugs: [home, desktop, desktop-legacy, wayland, x11, opengl, removable-media, shared-memory, network]
    # extensions: [gnome]
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3.12/site-packages
      QT_PLUGIN_PATH: $SNAP/lib/python3.12/site-packages/PyQt6/Qt6/plugins
      QML2_IMPORT_PATH: $SNAP/lib/python3.12/site-packages/PyQt6/Qt6/qml
      GIO_EXTRA_MODULES: ""
      QT_QPA_PLATFORMTHEME: ""
      GTK_A11Y: none
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QT_QPA_PLATFORM: xcb
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --disable-gpu-compositing --disable-vulkan --no-sandbox --disable-dev-shm-usage"

parts:
  launcher:
    plugin: dump
    source: snap/local
    organize:
      parquet-explorer-launch: bin/parquet-explorer-launch

  parquet-explorer:
    plugin: python
    source: .
    python-packages:
      - PyQt6
      - PyQt6-WebEngine
      - pyarrow
      - pandas
      - qdarkstyle
      - plotly
    stage-packages:
      # Python runtime
      - libpython3-stdlib
      - libpython3.12-minimal
      - libpython3.12-stdlib
      # Chromium/system deps for PyQt6-WebEngine (Qt itself comes from pip wheels)
      - libnss3
      - libnspr4
      - libdbus-1-3
      - libfontconfig1
      - libxcomposite1
      - libxcursor1
      - libxdamage1
      - libxi6
      - libxtst6
      - libasound2t64
      - libpulse0
      - libxss1
      - libegl1
      - libdrm2
      - libgbm1
      - libxcb1
      - libxcb-xfixes0
      - libxcb-shape0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-util1
      - libxcb-image0
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-xkb1
      - libxkbcommon0
      - libwayland-client0
      - libwayland-cursor0
      - libxkbfile1
      - libatomic1
      # OpenGL/Mesa + text/image codecs: pulled transitively on local builds but
      # missing from clean LXD CI builds without explicit stage-packages.
      - libgl1
      - libgl1-mesa-dri
      - libglx-mesa0
      - libglx0
      - libopengl0
      - libvulkan1
      - libharfbuzz0b
      - libharfbuzz-subset0
      - libgraphite2-3
      - libminizip1t64
      - libxslt1.1
      - libdouble-conversion3
      - libjpeg-turbo8
      - libopenjp2-7
      - libwebp7
      - libwebpdemux2
      - libwebpmux3
      - libsharpyuv0
      - libsnappy1v5
      - liblcms2-2
      - libmd4c0
      - libxcb-glx0
      - libxxf86vm1
      - libxrandr2
      - libxkbcommon-x11-0

    override-prime: |
      craftctl default
      mv "${CRAFT_PRIME}/bin/parquet-explorer" "${CRAFT_PRIME}/bin/parquet-explorer.bin"
      # Ubuntu's libasound2 alias can resolve to the oss4 shim, which lacks WebEngine symbols.
      rm -f "${CRAFT_PRIME}/usr/lib/x86_64-linux-gnu/liboss4-salsa.so.2"*
      rm -rf "${CRAFT_PRIME}/usr/lib/x86_64-linux-gnu/oss4-libsalsa"
      if [ -f "${CRAFT_PRIME}/usr/lib/x86_64-linux-gnu/libasound.so.2.0.0" ]; then
        ln -sf libasound.so.2.0.0 "${CRAFT_PRIME}/usr/lib/x86_64-linux-gnu/libasound.so.2"
      fi
      # Ensure Mesa GBM backend exists inside the snap (libgbm1 ships gbm/dri_gbm.so).
      for triplet in x86_64-linux-gnu aarch64-linux-gnu; do
        gbm_dir="${CRAFT_PRIME}/usr/lib/${triplet}/gbm"
        mkdir -p "$gbm_dir"
        if [ ! -e "${gbm_dir}/dri_gbm.so" ]; then
          dri_gbm=$(find "${CRAFT_PRIME}/usr/lib/${triplet}" -name 'dri_gbm.so*' 2>/dev/null | head -1)
          if [ -n "$dri_gbm" ]; then
            cp -a "$dri_gbm" "${gbm_dir}/dri_gbm.so"
          else
            echo "WARNING: dri_gbm.so missing for ${triplet}" >&2
          fi
        fi
      done
      # Drop any distro Qt libs that would override PyQt6's bundled runtime.
      rm -f "${CRAFT_PRIME}/usr/lib/x86_64-linux-gnu/libQt6"*.so*
      rm -rf "${CRAFT_PRIME}/usr/lib/x86_64-linux-gnu/qt6"
